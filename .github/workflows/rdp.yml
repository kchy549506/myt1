name: Windows RDP with Tailscale & Pre-installed Apps

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Set Runneradmin Password
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "Demochy12@#" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: 2. Enable Remote Desktop (RDP)
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: 3. Install WinRAR and AutoHotkey v2
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "Installing WinRAR and AutoHotkey v2 via Chocolatey..."
          choco install winrar autohotkey -y --ignore-package-exit-codes --no-progress

      - name: 4. Install Telegram Desktop and Setup Desktop Shortcuts
        continue-on-error: true
        shell: powershell
        run: |
          # Ensure Desktop folders exist
          New-Item -ItemType Directory -Path "C:\Users\runneradmin\Desktop" -Force | Out-Null
          $publicDesktop = "C:\Users\Public\Desktop"
          $userDesktop = "C:\Users\runneradmin\Desktop"

          # 1. Download & Install Telegram Desktop
          Write-Host "Downloading Telegram Desktop Official Installer..."
          curl.exe -L -o "$env:TEMP\tsetup.exe" "https://telegram.org/dl/desktop/win64"
          Write-Host "Installing Telegram Desktop silently..."
          Start-Process -FilePath "$env:TEMP\tsetup.exe" -ArgumentList "/SP-", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"C:\Program Files\Telegram Desktop`"" -Wait

          # Create Desktop Shortcuts
          $WshShell = New-Object -ComObject WScript.Shell

          # Telegram Shortcut
          $tgPath = "C:\Program Files\Telegram Desktop\Telegram.exe"
          if (Test-Path $tgPath) {
              $sc1 = $WshShell.CreateShortcut("$publicDesktop\Telegram.lnk")
              $sc1.TargetPath = $tgPath
              $sc1.Save()
              $sc2 = $WshShell.CreateShortcut("$userDesktop\Telegram.lnk")
              $sc2.TargetPath = $tgPath
              $sc2.Save()
          }

          # Chrome Shortcut
          $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (Test-Path $chromePath) {
              $sc3 = $WshShell.CreateShortcut("$publicDesktop\Google Chrome.lnk")
              $sc3.TargetPath = $chromePath
              $sc3.Save()
              $sc4 = $WshShell.CreateShortcut("$userDesktop\Google Chrome.lnk")
              $sc4.TargetPath = $chromePath
              $sc4.Save()
          }
          Write-Host "Telegram installed and Desktop Shortcuts ready!"

      - name: 5. Setup AutoHotkey Script & Enable on Taskbar (Startup)
        shell: powershell
        run: |
          $userDesktopPath = "C:\Users\runneradmin\Desktop\custom_shortcuts.ahk"
          $publicDesktopPath = "C:\Users\Public\Desktop\custom_shortcuts.ahk"
          $startupPath = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\custom_shortcuts.ahk"

          $scriptLines = @(
              '#Requires AutoHotkey v2.0',
              '',
              'Esc::Send "^c"',
              'F1::Send "^v"',
              '`::Send "^a"',
              'NumpadSub::Send "{Backspace}"',
              'NumpadAdd::Send "#{PrintScreen}"'
          )

          # Save to Desktops and Startup folder
          $scriptLines | Set-Content -Path $userDesktopPath -Encoding UTF8
          $scriptLines | Set-Content -Path $publicDesktopPath -Encoding UTF8
          $scriptLines | Set-Content -Path $startupPath -Encoding UTF8

          # Add to Registry Run
          Set-ItemProperty -Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name "CustomHotkeys" -Value "cmd.exe /c start `"`" `"$startupPath`""
          Write-Host "AutoHotkey script successfully configured for Auto-Start!"

      - name: 6. Install & Configure Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          $env:Path += ";C:\Program Files\Tailscale"
          [Environment]::SetEnvironmentVariable("Path", $env:Path, [EnvironmentVariableTarget]::Machine)

      - name: 7. Start Tailscale Connection
        shell: cmd
        run: |
          "C:\Program Files\Tailscale\tailscale.exe" up --authkey=tskey-auth-ki6zrb4Wnc11CNTRL-m5QTzuLAESKjxSj4ZPMURKGVSsSQS24s --hostname=github-rdp --accept-routes

      - name: 8. Keep RDP Session Alive (6 Hours)
        shell: powershell
        run: |
          Write-Host "Tailscale RDP Ready!"
          $limitMinutes = 350
          for ($i = 1; $i -le $limitMinutes; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "Running: $i minutes passed..."
          }
