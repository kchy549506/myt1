name: Windows RDP with Tailscale & Pre-installed Apps

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Set Runneradmin Password
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "Demochy12@#" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: 2. Enable Remote Desktop (RDP)
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: 3. Install Apps (Telegram, WinRAR, AutoHotkey v2)
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "Installing WinRAR and AutoHotkey v2 via Chocolatey..."
          choco install winrar autohotkey -y --ignore-package-exit-codes --no-progress

          Write-Host "Setting up Chrome Shortcut on Desktop..."
          $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (Test-Path $chromePath) {
              $WshShell = New-Object -ComObject WScript.Shell
              $Shortcut = $WshShell.CreateShortcut("C:\Users\runneradmin\Desktop\Google Chrome.lnk")
              $Shortcut.TargetPath = $chromePath
              $Shortcut.Save()
          }

          Write-Host "Downloading Telegram Desktop Portable..."
          $desktop = "C:\Users\runneradmin\Desktop"
          Invoke-WebRequest -Uri "https://telegram.org/dl/desktop/win64_portable" -OutFile "$desktop\Telegram.zip"
          Expand-Archive -Path "$desktop\Telegram.zip" -DestinationPath "$desktop\Telegram" -Force
          Remove-Item "$desktop\Telegram.zip" -Force

          $telegramExe = "C:\Users\runneradmin\Desktop\Telegram\Telegram.exe"
          if (Test-Path $telegramExe) {
              $WshShell = New-Object -ComObject WScript.Shell
              $Shortcut = $WshShell.CreateShortcut("C:\Users\runneradmin\Desktop\Telegram.lnk")
              $Shortcut.TargetPath = $telegramExe
              $Shortcut.Save()
          }
          Write-Host "Telegram and Desktop Shortcuts successfully created!"

      - name: 4. Install Google Antigravity IDE
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "Downloading Google Antigravity IDE..."
          $url = "https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.6.0-5526304964083712/windows-x64/Antigravity%20IDE.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\AntigravitySetup.exe"
          Write-Host "Installing Google Antigravity IDE silently..."
          Start-Process -FilePath "$env:TEMP\AntigravitySetup.exe" -ArgumentList "/VERYSILENT", "/NORESTART", "/MERGETASKS=!runcode" -Wait

      - name: 5. Setup AutoHotkey Script & Enable on Taskbar (Startup)
        shell: powershell
        run: |
          $desktopPath = "C:\Users\runneradmin\Desktop\custom_shortcuts.ahk"
          $startupPath = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\custom_shortcuts.ahk"

          $scriptLines = @(
              '#Requires AutoHotkey v2.0',
              '',
              'Esc::Send "^c"',
              'F1::Send "^v"',
              '`::Send "^a"',
              'NumpadSub::Send "{Backspace}"',
              'NumpadAdd::Send "#{PrintScreen}"'
          )

          # Save to Desktop and Startup folder
          $scriptLines | Set-Content -Path $desktopPath -Encoding UTF8
          $scriptLines | Set-Content -Path $startupPath -Encoding UTF8

          # Add to Registry Run
          Set-ItemProperty -Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name "CustomHotkeys" -Value "cmd.exe /c start `"`" `"$startupPath`""
          Write-Host "AutoHotkey script successfully configured for Auto-Start!"

      - name: 6. Install & Configure Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          $env:Path += ";C:\Program Files\Tailscale"
          [Environment]::SetEnvironmentVariable("Path", $env:Path, [EnvironmentVariableTarget]::Machine)

      - name: 7. Start Tailscale Connection
        shell: cmd
        run: |
          "C:\Program Files\Tailscale\tailscale.exe" up --authkey=tskey-auth-ki6zrb4Wnc11CNTRL-m5QTzuLAESKjxSj4ZPMURKGVSsSQS24s --hostname=github-rdp --accept-routes

      - name: 8. Keep RDP Session Alive (6 Hours)
        shell: powershell
        run: |
          Write-Host "Tailscale RDP Ready!"
          $limitMinutes = 350
          for ($i = 1; $i -le $limitMinutes; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "Running: $i minutes passed..."
          }
